# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an older run still building.
concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as deploy-pages recommends: GitHub's list of a run's artifacts can
# lag a moment behind an upload, so deploying in the same job right after the
# upload sometimes finds nothing ("No artifacts named github-pages"). Starting
# a second job gives the list time to catch up.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        # Not `npm ci`: npm on Windows sometimes drops other platforms' optional
        # packages from package-lock.json, and `npm ci` then refuses to install.
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
